name: Build Leanback Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 默认 GITHUB_TOKEN 仅有 contents:read，创建 Release 需要 contents:write，
    # 否则 action-gh-release 会返回 403 Resource not accessible by integration。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub runner 预装的 sdkmanager 索引较旧，无法识别 platforms;android-37，
      # 因此这里自下载官方 commandlinetools 并安装所需平台/构建工具。
      - name: Install Android SDK packages
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null || true
          # 与本地 SDK 版本一致：platform android-37.0 + build-tools 36.0.0
          # （仓库稳定包名为 platforms;android-37.0，而非 android-37）
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # 项目在配置阶段强制读取 local.properties，且 release 变体使用 release 签名配置，
      # 因此云端必须提供该文件。这里生成一个仅用于 CI 的临时 keystore，不泄露真实签名。
      - name: Generate local.properties (CI signing)
        run: |
          keytool -genkeypair -v -keystore "$HOME/cloud.keystore" -alias cloud \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cloudpass123 -keypass cloudpass123 \
            -dname "CN=NewTV, OU=CI, O=NewTV, L=CI, S=CI, C=CN"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$ANDROID_HOME/cmake"
            echo "storeFile=$HOME/cloud.keystore"
            echo "keyAlias=cloud"
            echo "storePassword=cloudpass123"
            echo "keyPassword=cloudpass123"
          } > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build leanback release
        run: ./gradlew :app:assembleLeanbackRelease -Pandroid.overridePathCheck=true --no-daemon

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-leanback-release
          path: app/build/outputs/apk/leanback/release/*.apk

      # 每次成功构建自动创建一个 GitHub Release，并附带两个 ABI 的正式版 APK。
      # 使用 github.run_number 作为唯一 tag，避免重复创建冲突。
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NewTV Release ${{ github.run_number }}
          files: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
