name: Build Leanback Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 默认 GITHUB_TOKEN 仅有 contents:read，创建 Release 需要 contents:write，
    # 否则 action-gh-release 会返回 403 Resource not accessible by integration。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub runner 预装的 sdkmanager 索引较旧，无法识别 platforms;android-37，
      # 因此这里自下载官方 commandlinetools 并安装所需平台/构建工具。
      - name: Install Android SDK packages
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null || true
          # 与本地 SDK 版本一致：platform android-37.0 + build-tools 36.0.0
          # （仓库稳定包名为 platforms;android-37.0，而非 android-37）
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # 项目在配置阶段强制读取 local.properties，且 debug / release 共用 signingConfigs.release。
      # 云端必须复用与本地完全相同的签名证书：若现场新建临时 keystore，CI 正式版与本地包、
      # 以及不同 run 的 CI 包之间签名都不匹配，覆盖安装会被 INSTALL_FAILED_UPDATE_INCOMPATIBLE 拒绝。
      # keystore 以 base64 存于 Actions Secrets，仅构建期解码到 runner，构建结束即销毁。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets: ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/release.keystore"
          chmod 600 "$HOME/release.keystore"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$ANDROID_HOME/cmake"
            echo "storeFile=$HOME/release.keystore"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$KEY_STORE_PASSWORD"
          } > local.properties
          # build.gradle 的 keyPassword 取的是 storePassword；fongmi.jks 的 key 密码与 store 密码相同，
          # 因此这里不需要额外的 keyPassword 项。

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build leanback release
        run: ./gradlew :app:assembleLeanbackRelease -Pandroid.overridePathCheck=true --no-daemon

      # 签名只发生在构建期，产物已落盘后立即销毁临时私钥与 local.properties。
      - name: Cleanup signing material
        if: always()
        run: rm -f "$HOME/release.keystore" local.properties

      # 防回归：把每个产物的签名证书指纹写进 CI 日志，便于核对是否与本地一致。
      # 本地 fongmi.jks 基准 SHA-256：b10750e52e230acaca3946951ec5c0cfaeb7e636e1b35b8dd35c64df2687b802
      - name: Report signing certificate
        if: success()
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner not found, skip certificate report"
            exit 0
          fi
          for apk in app/build/outputs/apk/leanback/release/*.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs "$apk" || true
          done

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-leanback-release
          path: app/build/outputs/apk/leanback/release/*.apk

      # 每次成功构建自动创建一个 GitHub Release，并附带两个 ABI 的正式版 APK。
      # 使用 github.run_number 作为唯一 tag，避免重复创建冲突。
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NewTV Release ${{ github.run_number }}
          files: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
